name: Generate and train cascaded SVM
on:
  workflow_dispatch:
    inputs:
      samples_per_model:
        description: Total samples per binary dataset (even number)
        required: true
        default: '200'
        type: string
      seed:
        description: Random seed
        required: true
        default: '42'
        type: string
      consensus:
        description: Run full feature consensus and ablation
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r models/requirements.txt
      - run: python -m unittest discover -s dataset_generation -p 'test_*.py'
      - name: Generate
        env:
          N: ${{ inputs.samples_per_model }}
          SEED: ${{ inputs.seed }}
        run: python dataset_generation/generate.py --samples-per-model "$N" --seed "$SEED" --output datasets
      - name: Train
        env:
          SEED: ${{ inputs.seed }}
          CONSENSUS: ${{ inputs.consensus }}
        run: |
          args=()
          if [[ "$CONSENSUS" == "true" ]]; then args+=(--consensus); fi
          python models/train.py --data datasets --output model_outputs --seed "$SEED" "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: cascaded-svm-results
          path: |
            model_outputs/
            datasets/metadata.json
          if-no-files-found: error
          retention-days: 14
