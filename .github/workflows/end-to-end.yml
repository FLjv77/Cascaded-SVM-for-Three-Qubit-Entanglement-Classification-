name: End-to-end research pipeline
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Execution profile
        type: choice
        options:
          - smoke
          - pilot
          - baseline
          - paper
        default: smoke
      seed:
        description: Optional single seed override (blank uses profile seeds)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      seeds: ${{ steps.plan.outputs.seeds }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          PROFILE: ${{ inputs.profile }}
          SEED: ${{ inputs.seed }}
        run: |
          python - <<'PY'
          import json,os
          c=json.load(open("configs/end_to_end.json"))
          seeds=[int(os.environ["SEED"])] if os.environ["SEED"] else c["profiles"][os.environ["PROFILE"]].get("seeds",c["seeds"])
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("seeds="+json.dumps(seeds)+"\n")
          PY
  run:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: ${{ fromJSON(needs.plan.outputs.seeds) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r experiments/requirements.txt
      - run: python -m unittest discover -s dataset_generation -p 'test_*.py'
      - run: python -m unittest discover -s experiments -p 'test_*.py'
      - name: Run pipeline
        env:
          PROFILE: ${{ inputs.profile }}
          SEED: ${{ matrix.seed }}
        run: python run_pipeline.py --profile "$PROFILE" --seed "$SEED"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ inputs.profile }}-${{ matrix.seed }}
          path: |
            runs/
          if-no-files-found: warn
          retention-days: 14
  summarize:
    needs: run
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-*
          path: collected
      - name: Aggregate successful runs
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          from run_pipeline import aggregate
          folders=sorted(p.parent for p in Path("collected").rglob("manifest.json"))
          aggregate(folders,Path("multi_seed_summary.json"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: multi-seed-summary
          path: multi_seed_summary.json
